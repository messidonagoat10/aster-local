[project]
name = "aster-local"
version = "0.1.1"
description = "A local-first text and voice assistant."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.162.7",
    "httpx2==2.16.0",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]
voice = ["sherpa-onnx==2.0.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

